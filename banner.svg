<svg width="1280" height="320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#005B96"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Neural Network / Constellation Pattern Left -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="4" fill="#64ffda"/>
    <circle cx="200" cy="150" r="6" fill="#64ffda"/>
    <circle cx="120" cy="220" r="3" fill="#64ffda"/>
    <circle cx="280" cy="100" r="5" fill="#64ffda"/>
    <circle cx="80" cy="140" r="4" fill="#64ffda"/>
    <line x1="150" y1="80" x2="200" y2="150" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="200" y1="150" x2="120" y2="220" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="200" y1="150" x2="280" y2="100" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="150" y1="80" x2="80" y2="140" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="80" y1="140" x2="120" y2="220" stroke="#64ffda" stroke-width="1.5"/>
  </g>

  <!-- Neural Network / Constellation Pattern Right -->
  <g opacity="0.25">
    <circle cx="1080" cy="180" r="6" fill="#64ffda"/>
    <circle cx="1180" cy="120" r="4" fill="#64ffda"/>
    <circle cx="1130" cy="250" r="5" fill="#64ffda"/>
    <circle cx="1220" cy="190" r="3" fill="#64ffda"/>
    <circle cx="1020" cy="110" r="4" fill="#64ffda"/>
    <line x1="1080" y1="180" x2="1180" y2="120" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="1080" y1="180" x2="1130" y2="250" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="1180" y1="120" x2="1220" y2="190" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="1130" y1="250" x2="1220" y2="190" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="1080" y1="180" x2="1020" y2="110" stroke="#64ffda" stroke-width="1.5"/>
    <line x1="1020" y1="110" x2="1180" y2="120" stroke="#64ffda" stroke-width="1.5"/>
  </g>

  <!-- Title Text -->
  <text x="50%" y="42%" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#ffffff" filter="url(#glow)">
    Smart Fish Disease Detection
  </text>
  
  <text x="50%" y="60%" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="500" text-anchor="middle" fill="#B3E5FC">
    &amp; Identification System
  </text>
  
  <!-- Technologies / Tags -->
  <g opacity="0.9">
    <rect x="365" y="240" width="130" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="#64ffda" stroke-width="1"/>
    <text x="430" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64ffda" letter-spacing="1">DEEP LEARNING</text>

    <rect x="515" y="240" width="100" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="#64ffda" stroke-width="1"/>
    <text x="565" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64ffda" letter-spacing="1">FASTAPI</text>

    <rect x="635" y="240" width="110" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="#64ffda" stroke-width="1"/>
    <text x="690" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64ffda" letter-spacing="1">PYTORCH</text>

    <rect x="765" y="240" width="150" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="#64ffda" stroke-width="1"/>
    <text x="840" y="264" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#64ffda" letter-spacing="1">COMPUTER VISION</text>
  </g>
</svg>
